[project]
name = "tripmate-ai"
version = "2.0.0"
description = "LangGraph multi-agent travel planner with supervisor, guardrails, human-in-the-loop, and a FastAPI frontend."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "langchain-core",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "mcp>=1.28.1",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "requests>=2.32",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
tripmate = "tripmate.__main__:main"
tripmate-weather-mcp = "tripmate.mcp_servers.weather:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripmate"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Prompt templates keep their natural line lengths.
"src/tripmate/agents/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
